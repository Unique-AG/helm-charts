{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.webhook.serviceName | default "agent-sandbox-webhook-service" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "agent-sandbox.controller.selectorLabels" . | nindent 4 }}
  ports:
  - name: webhook
    port: 443
    targetPort: 9443
    protocol: TCP
{{- end }}
