{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-sandbox.router.name" . }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox.router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-sandbox.router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-sandbox.router.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.router.cache.enabled }}
      serviceAccountName: {{ include "agent-sandbox.router.name" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: 45
      {{- with .Values.router.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.router.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.router.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.router.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.router.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "agent-sandbox.router.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag | default .Chart.AppVersion }}{{ if .Values.router.image.digest }}@{{ .Values.router.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          args:
            - --http-bind-address=:{{ .Values.router.containerPort }}
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --proxy-timeout={{ .Values.router.proxyTimeoutSeconds | default 180 }}s
            - --upstream-max-retries={{ .Values.router.upstreamMaxRetries | default 3 }}
            - --cache-enabled={{ .Values.router.cache.enabled }}
            {{- range .Values.router.extraArgs | default list }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.router.containerPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.router.readinessProbe.path }}
              port: healthz
            initialDelaySeconds: {{ .Values.router.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.router.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.router.livenessProbe.path }}
              port: healthz
            initialDelaySeconds: {{ .Values.router.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.router.livenessProbe.periodSeconds }}
          {{- with .Values.router.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
{{- end }}
