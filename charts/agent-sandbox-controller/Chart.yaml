apiVersion: v2
type: application
icon: https://www.unique.ch/hubfs/unique_assets/favicon/glyph_caumasee.svg
maintainers:
  - name: unique-ag
    url: https://unique.ch/
name: agent-sandbox-controller
sources:
  - https://github.com/Unique-AG/helm-charts/tree/main/charts/agent-sandbox-controller
  - https://github.com/kubernetes-sigs/agent-sandbox
version: 1.0.1
appVersion: "v1.0.1"
description: |
  Helm chart for the Agent Sandbox controller — a Kubernetes CRD and controller for managing isolated, stateful, singleton workloads (e.g. AI agent runtimes).

  Upstream project: https://github.com/kubernetes-sigs/agent-sandbox
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: Bumped upstream agent-sandbox to v1.0.1 (controller image, router image, and CRDs). Breaking — v1alpha1 and the conversion webhook are removed; upgrade through chart 0.5.6 first (see README).
    - kind: removed
      description: Conversion webhook Service, cert Secret Role/RoleBinding, webhook port 9443, webhook controller flags, and the `webhook` values block (upstream removed v1alpha1 and all webhook infrastructure).
    - kind: removed
      description: Controller ClusterRole rule patching CRD conversion webhook caBundles (no longer needed).
    - kind: changed
      description: Router now runs the official Go sandbox-router image (registry.k8s.io/agent-sandbox/sandbox-router-go) configured via flags, with metrics (9090) and health (8081) ports and /readyz readiness.
    - kind: added
      description: Optional router Pod-IP cache (`router.cache.enabled`) with the ServiceAccount and RBAC it requires.
    - kind: removed
      description: files/migrate.sh (v1alpha1 storage migration happens on chart 0.5.6, before this upgrade).
    - kind: removed
      description: router.auth values — the Go router handles authorization via `--authz-mode` flags (default allow-all); use `router.extraArgs` for tokenreview mode.
