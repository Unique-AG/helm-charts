apiVersion: v2
type: application
icon: https://www.unique.ch/hubfs/unique_assets/favicon/glyph_caumasee.svg
maintainers:
  - name: unique-ag
    url: https://unique.ch/
name: agent-sandbox-controller
sources:
  - https://github.com/Unique-AG/helm-charts/tree/main/charts/agent-sandbox-controller
  - https://github.com/kubernetes-sigs/agent-sandbox
version: 1.1.0
appVersion: "v1.0.1"
description: |
  Helm chart for the Agent Sandbox controller — a Kubernetes CRD and controller for managing isolated, stateful, singleton workloads (e.g. AI agent runtimes).

  Upstream project: https://github.com/kubernetes-sigs/agent-sandbox
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: "priorityClassName on the controller and on the router. Unset by default."
    - kind: added
      description: "service.trafficDistribution on both Services, resolved against the cluster version: PreferSameZone needs Kubernetes 1.34, 1.31-1.33 get the PreferClose alias, older clusters get no field. Empty by default."
    - kind: added
      description: "PodDisruptionBudgets for the controller and the router, each rendered only above one replica. Disabled by default."
