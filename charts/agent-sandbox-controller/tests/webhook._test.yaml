# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test Webhook Service
templates:
  - webhook-service.yaml
release:
  name: ut
tests:
  - it: Renders the conversion webhook Service by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: agent-sandbox-webhook-service
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: 9443

  - it: Honors a custom webhook service name
    set:
      webhook:
        serviceName: custom-webhook
    asserts:
      - equal:
          path: metadata.name
          value: custom-webhook

  - it: Omits the webhook Service when webhook.enabled=false
    set:
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
