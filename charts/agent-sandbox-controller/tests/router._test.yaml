# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test Router Resources
templates:
  - router-deployment.yaml
  - router-service.yaml
  - router-networkpolicy.yaml
  - router-rbac.yaml
release:
  name: ut
tests:
  - it: Renders the router Deployment, Service and NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 1
        template: router-deployment.yaml
      - hasDocuments:
          count: 1
        template: router-service.yaml
      - hasDocuments:
          count: 1
        template: router-networkpolicy.yaml
      - hasDocuments:
          count: 0
        template: router-rbac.yaml

  - it: Configures the Go router via flags
    template: router-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^registry.k8s.io/agent-sandbox/sandbox-router-go:.*@sha256:.+$"
      - contains:
          path: spec.template.spec.containers[0].args
          content: --http-bind-address=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --proxy-timeout=180s
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cache-enabled=false
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: healthz
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: Creates the router ServiceAccount and RBAC when the Pod-IP cache is enabled
    set:
      router:
        cache:
          enabled: true
    asserts:
      - hasDocuments:
          count: 3
        template: router-rbac.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cache-enabled=true
        template: router-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: ut-agent-sandbox-controller-router
        template: router-deployment.yaml

  - it: Disables all router resources when router.enabled=false
    set:
      router:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: router-deployment.yaml
      - hasDocuments:
          count: 0
        template: router-service.yaml
      - hasDocuments:
          count: 0
        template: router-networkpolicy.yaml
      - hasDocuments:
          count: 0
        template: router-rbac.yaml

  - it: Uses a custom router service name when provided
    template: router-service.yaml
    set:
      router:
        service:
          name: sandbox-router-svc
    asserts:
      - equal:
          path: metadata.name
          value: sandbox-router-svc

  - it: Defaults to a release-prefixed router service name
    template: router-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ut-agent-sandbox-controller-router-svc
