# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test Router Resources
templates:
  - router-deployment.yaml
  - router-service.yaml
  - router-networkpolicy.yaml
release:
  name: ut
tests:
  - it: Renders the router Deployment, Service and NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 1
        template: router-deployment.yaml
      - hasDocuments:
          count: 1
        template: router-service.yaml
      - hasDocuments:
          count: 1
        template: router-networkpolicy.yaml

  - it: Disables all router resources when router.enabled=false
    set:
      router:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: router-deployment.yaml
      - hasDocuments:
          count: 0
        template: router-service.yaml
      - hasDocuments:
          count: 0
        template: router-networkpolicy.yaml

  - it: Uses a custom router service name when provided
    template: router-service.yaml
    set:
      router:
        service:
          name: sandbox-router-svc
    asserts:
      - equal:
          path: metadata.name
          value: sandbox-router-svc

  - it: Defaults to a release-prefixed router service name
    template: router-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ut-agent-sandbox-controller-router-svc

  - it: Requires auth by default (no auth env rendered)
    template: router-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_UNAUTHENTICATED_ROUTER
            value: "true"

  - it: Reads the router auth token from an existing Secret
    template: router-deployment.yaml
    set:
      router:
        auth:
          existingSecret: router-auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROUTER_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: router-auth
                key: token

  - it: Allows explicit unauthenticated mode
    template: router-deployment.yaml
    set:
      router:
        auth:
          allowUnauthenticated: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_UNAUTHENTICATED_ROUTER
            value: "true"
