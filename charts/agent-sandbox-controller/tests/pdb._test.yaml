# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: PodDisruptionBudgets and priority
release:
  name: ut
tests:
  - it: renders no budget by default
    templates:
      - pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the router budget when enabled at one controller replica
    templates:
      - pdb.yaml
    set:
      pdb.enabled: true
      router.pdb.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: renders both once the controller has two
    templates:
      - pdb.yaml
    set:
      pdb.enabled: true
      router.pdb.enabled: true
      replicaCount: 2
    asserts:
      - hasDocuments:
          count: 2

  - it: sets no priority class unless asked
    templates:
      - deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: quotes the priority class when asked
    templates:
      - deployment.yaml
    set:
      priorityClassName: unique-platform
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: unique-platform
