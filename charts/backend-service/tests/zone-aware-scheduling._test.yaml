# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Zone-aware scheduling and the PDB gate
release:
  name: ut
tests:
  - it: downgrades trafficDistribution to PreferClose below Kubernetes 1.34
    templates: [service.yaml]
    capabilities:
      majorVersion: 1
      minorVersion: 33
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - equal: {path: spec.trafficDistribution, value: PreferClose}

  - it: uses PreferSameZone from 1.34
    templates: [service.yaml]
    capabilities:
      majorVersion: 1
      minorVersion: 34
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - equal: {path: spec.trafficDistribution, value: PreferSameZone}

  - it: omits trafficDistribution where the field does not exist
    templates: [service.yaml]
    capabilities:
      majorVersion: 1
      minorVersion: 30
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - notExists: {path: spec.trafficDistribution}

  - it: omits trafficDistribution when cleared
    templates: [service.yaml]
    set:
      service.trafficDistribution: ""
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - notExists: {path: spec.trafficDistribution}

  - it: spreads replicas across zones
    templates: [deployment.yaml]
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: omits the spread constraint when disabled
    templates: [deployment.yaml]
    set:
      topologySpreadConstraints.enabled: false
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - notExists: {path: spec.template.spec.topologySpreadConstraints}

  - it: renders a budget for a KEDA workload whose floor is above one
    templates: [pdb.yaml]
    set:
      keda.enabled: true
      keda.minReplicaCount: 3
      keda.triggers.cpu-trigger.type: cpu
      keda.triggers.cpu-trigger.metricType: Utilization
      keda.triggers.cpu-trigger.metadata.value: "80"
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: PodDisruptionBudget}

  - it: renders no budget for a KEDA workload that can sit at one
    templates: [pdb.yaml]
    set:
      keda.enabled: true
      keda.minReplicaCount: 1
      keda.triggers.cpu-trigger.type: cpu
      keda.triggers.cpu-trigger.metricType: Utilization
      keda.triggers.cpu-trigger.metadata.value: "80"
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
        - keda.sh/v1alpha1
    asserts:
      - hasDocuments: {count: 0}
