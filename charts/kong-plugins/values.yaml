# Default values for kong-plugins.

# -- List of plugins to be installed


# -- jwtAuth enables the jwt-auth plugin
jwtAuth:
  # -- The name of the jwt auth config map
  name: kong-plugin-unique-jwt-auth

# -- appRepoAuth enables the app-repo-auth plugin
appRepoAuth:
  # -- The name of the app repository auth config map
  name: kong-plugin-unique-app-repo-auth
  # -- The default app repository url
  appRepositoryUrl: "http://service-app-repository.default.svc:8088"

prometheus:
  # -- Enable Prometheus integration. When false no PrometheusRule resources are rendered.
  enabled: true
  defaultAlerts:
    # -- securityWarnings alerts fire on the counters emitted by the kong plugins for each WARN-level security rejection.
    securityWarnings:
      # -- Enable the security warnings alert group. Requires monitoring.coreos.com/v1 CRDs.
      enabled: true
      # -- Base metric name (without kong_ prefix) used in PromQL for the jwt-auth plugin. Must match config.security_warning_metric_name on the KongClusterPlugin.
      jwtAuthMetricName: kong_unique_jwt_auth_security_warnings_total
      # -- Base metric name (without kong_ prefix) used in PromQL for the app-repo-auth plugin. Must match config.security_warning_metric_name on the KongClusterPlugin.
      appRepoAuthMetricName: kong_unique_app_repo_auth_security_warnings_total
      # -- Per-alert configuration. Each entry controls enabled, severity, for, threshold (number of occurrences in interval), and interval (PromQL range window).
      rules:
        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="invalid_signature"}[interval])) > threshold.
        # Measures: count of JWTs rejected because no current JWKS key for the issuer could verify the signature.
        # Attack signal: issuer was allowed but signature verification failed after JWKS refresh. Near-zero baseline in prod.
        KongJwtAuthInvalidSignature:
          enabled: true
          for: "0m"
          severity: critical
          threshold: 3
          interval: "10m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="disallowed_issuer"}[interval])) > threshold.
        # Measures: count of JWTs whose 'iss' claim did not match any entry in allowed_iss.
        # Dev noise: devs pasting tokens from another environment. High volume may indicate reconnaissance.
        KongJwtAuthDisallowedIssuer:
          enabled: true
          for: "5m"
          severity: warning
          threshold: 15
          interval: "15m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="unexpected_algorithm"}[interval])) > threshold.
        # Measures: count of JWTs whose 'alg' header did not match the configured algorithm (default RS256).
        # Attack signal: algorithm confusion probing. Legit Zitadel clients cannot produce this.
        KongJwtAuthUnexpectedAlgorithm:
          enabled: true
          for: "0m"
          severity: critical
          threshold: 3
          interval: "15m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="malformed_jwt"}[interval])) > threshold.
        # Measures: count of requests that carried a token which could not be decoded as a valid JWT structure.
        # Dev noise: broken clients and scanners. Large sustained bursts still surface misconfigured integrations.
        KongJwtAuthMalformedJwt:
          enabled: true
          for: "10m"
          severity: warning
          threshold: 50
          interval: "15m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="multiple_tokens"}[interval])) > threshold.
        # Measures: count of requests that supplied more than one token (e.g. both header and query param).
        # Dev noise: client bugs sending tokens in multiple locations.
        KongJwtAuthMultipleTokens:
          enabled: true
          for: "5m"
          severity: warning
          threshold: 10
          interval: "15m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="unrecognizable_token_type"}[interval])) > threshold.
        # Measures: count of requests where the extracted token was neither a string nor a table (internal parsing edge case).
        # Dev noise: client bugs or malformed request parsing.
        KongJwtAuthUnrecognizableTokenType:
          enabled: true
          for: "5m"
          severity: warning
          threshold: 10
          interval: "15m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="claims_validation_failed"}[interval])) > threshold.
        # Measures: count of JWTs rejected because a registered claim other than exp (e.g. nbf) failed verification.
        KongJwtAuthClaimsValidationFailed:
          enabled: false
          for: "0m"
          severity: warning
          threshold: 2
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="token_expired"}[interval])) > threshold.
        # Measures: count of JWTs rejected because the exp claim indicated the token has expired.
        # Disabled by default — token expiry is a normal operational event; enable only for targeted visibility.
        KongJwtAuthTokenExpired:
          enabled: false
          for: "0m"
          severity: warning
          threshold: 2
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="max_expiration_exceeded"}[interval])) > threshold.
        # Measures: count of JWTs rejected because their lifetime exceeds the configured maximum_expiration.
        # Disabled by default — may indicate clients issuing long-lived tokens, not an active attack.
        KongJwtAuthMaxExpirationExceeded:
          enabled: false
          for: "0m"
          severity: warning
          threshold: 2
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="ws_ticket_unknown"}[interval])) > threshold.
        # Measures: forged, expired, replayed, or non-upgrade presentations of single-use WebSocket tickets.
        KongJwtAuthWsTicketUnknown:
          enabled: true
          for: "0m"
          severity: warning
          threshold: 5
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="ws_ticket_scope_mismatch"}[interval])) > threshold.
        # Measures: tickets presented on a different route/service than they were minted for.
        KongJwtAuthWsTicketScopeMismatch:
          enabled: true
          for: "0m"
          severity: critical
          threshold: 2
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="ws_ticket_origin_rejected"}[interval])) > threshold.
        # Measures: ticket upgrades whose Origin header was missing or not on the exact allowlist.
        KongJwtAuthWsTicketOriginRejected:
          enabled: true
          for: "0m"
          severity: warning
          threshold: 2
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="ws_ticket_mint_rate_limited"}[interval])) > threshold.
        # Measures: authenticated subjects that exceeded ticket_mint_rate_limit.
        KongJwtAuthWsTicketMintRateLimited:
          enabled: true
          for: "0m"
          severity: warning
          threshold: 10
          interval: "5m"

        # Fires when sum(increase(kong_unique_jwt_auth_security_warnings_total{reason="ws_ticket_redis_error"}[interval])) > threshold.
        # Measures: ticket mint/consume failures caused by Redis unavailability (fail-closed).
        KongJwtAuthWsTicketRedisError:
          enabled: true
          for: "1m"
          severity: critical
          threshold: 2
          interval: "5m"

        # Fires when sum(increase(kong_unique_app_repo_auth_security_warnings_total{reason="api_key_validation_failed"}[interval])) > threshold.
        # Measures: count of requests where the app repository returned a non-200 response for the provided API key.
        # Dev noise: revoked keys and typos (~190/day baseline in prod). Sustained high volume may indicate brute-forcing.
        KongAppRepoAuthApiKeyValidationFailed:
          enabled: true
          for: "10m"
          severity: warning
          threshold: 250
          interval: "15m"

        # Fires when sum(increase(kong_unique_app_repo_auth_security_warnings_total{reason="multiple_tokens"}[interval])) > threshold.
        # Measures: count of requests that supplied more than one API key token simultaneously.
        # Dev noise: client bugs sending tokens in multiple locations.
        KongAppRepoAuthMultipleTokens:
          enabled: true
          for: "5m"
          severity: warning
          threshold: 10
          interval: "15m"

        # Fires when sum(increase(kong_unique_app_repo_auth_security_warnings_total{reason="unrecognizable_token_type"}[interval])) > threshold.
        # Measures: count of requests where the extracted token was neither a string nor a table (internal parsing edge case).
        # Dev noise: client bugs or malformed request parsing.
        KongAppRepoAuthUnrecognizableTokenType:
          enabled: true
          for: "5m"
          severity: warning
          threshold: 10
          interval: "15m"

        # Fires when sum(increase(kong_unique_app_repo_auth_security_warnings_total{reason="missing_required_headers"}[interval])) > threshold.
        # Measures: count of requests missing x-app-id or x-company-id headers required for API key validation.
        # Dev noise: misconfigured API clients omitting required headers.
        KongAppRepoAuthMissingRequiredHeaders:
          enabled: true
          for: "5m"
          severity: warning
          threshold: 50
          interval: "15m"

      # -- Extra labels added to the PrometheusRule metadata and each alert's labels.
      additionalLabels: {}
