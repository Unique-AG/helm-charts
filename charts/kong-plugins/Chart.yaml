apiVersion: v2
type: application
icon: https://www.unique.ch/hubfs/unique_assets/favicon/glyph_caumasee.svg
maintainers:
  - name: unique-ag
    url: https://unique.ch/
name: kong-plugins
version: 2.5.0
description: |
  The 'kong-plugins' chart provides a streamlined solution for deploying Kong plugins via ConfigMaps to be used with the Unique Software.

  Refer to each plugins readme section to learn more about them.

  Please report any security concerns with the plugins via the [Security Policy](https://github.com/Unique-AG/helm-charts/tree/main?tab=security-ov-file).
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: unique-jwt-auth can validate opaque query-string tokens via Zitadel introspection for WebSocket upgrades, so browsers no longer put a long-lived JWT in the URL
    - kind: added
      description: two alerts covering inactive introspected tokens and introspection transport or configuration failures
    - kind: added
      description: Lua test harness for unique-jwt-auth with a digest-pinned Kong image
