apiVersion: v2
type: application
icon: https://www.unique.ch/hubfs/unique_assets/favicon/glyph_caumasee.svg
maintainers:
  - name: unique-ag
    url: https://unique.ch/
name: kong-plugins
version: 2.5.0
description: |
  The 'kong-plugins' chart provides a streamlined solution for deploying Kong plugins via ConfigMaps to be used with the Unique Software.

  Refer to each plugins readme section to learn more about them.

  Please report any security concerns with the plugins via the [Security Policy](https://github.com/Unique-AG/helm-charts/tree/main?tab=security-ov-file).
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: unique-jwt-auth mints short-lived HS256 WebSocket upgrade tickets at ws_ticket_mint_path so browsers no longer have to put an access token in the WebSocket URL
    - kind: added
      description: unique-jwt-auth accepts tickets as credentials, stamping only x-user-id and x-company-id upstream and clearing every other identity header
    - kind: added
      description: reject_jwt_in_query refuses access tokens presented in a query parameter, to be enabled once all clients send tickets
    - kind: added
      description: five alerts covering ticket forgery, audience mismatch, mint abuse, ticket expiry and rejected query-string access tokens
