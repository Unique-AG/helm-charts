# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Zone-aware scheduling and priority
release:
  name: ut
tests:
  - it: downgrades trafficDistribution below Kubernetes 1.34
    templates:
      - service.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 33
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferClose

  - it: uses PreferSameZone from 1.34
    templates:
      - service.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 34
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferSameZone

  - it: spreads replicas across zones
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: sets no priority class unless asked
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: sets the priority class when asked
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      priorityClassName: unique-product
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: unique-product
