# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Zone-aware scheduling and priority
release:
  name: ut
tests:
  - it: adds nothing by default
    templates:
      - service.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - notExists:
          path: spec.trafficDistribution

  - it: downgrades PreferSameZone below Kubernetes 1.34
    templates:
      - service.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 33
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      service.trafficDistribution: PreferSameZone
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferClose

  - it: keeps an explicitly chosen PreferClose below 1.34
    templates:
      - service.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 33
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      service.trafficDistribution: PreferClose
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferClose

  - it: uses PreferSameZone from 1.34
    templates:
      - service.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 34
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      service.trafficDistribution: PreferSameZone
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferSameZone

  - it: adds no spread constraint by default
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: nests the selector under matchLabels when enabled
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      topologySpreadConstraints.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: ut

  - it: sets no priority class unless asked
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: quotes the priority class when asked
    templates:
      - deployment.yaml
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1
    set:
      priorityClassName: unique-product
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: unique-product
